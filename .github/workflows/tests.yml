name: CI

on:
  push:
  pull_request:

# Explicitly restrict the auto-provisioned GITHUB_TOKEN to the least privilege required
# for this workflow.
permissions:
  contents: read

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Used by the `Version` class so it can identify the current fork
  PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}

  # Used by `Version`. We want the PR author's latest commit hash if this is a PR
  # but the default SHA env var reflects a new commit into the target repo.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.10: currently used by Seedsigner
        # 3.12: latest stable Python as upper test bound
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Needs to also pull the seedsigner-translations repo
          submodules: recursive
          # Also needed for the gitleaks step below: actions/checkout@v4
          # shallow-clones (depth 1) by default, which would leave gitleaks
          # only able to scan the tip commit, not full history.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get install libzbar0 qrencode
          python -m pip install --upgrade pip
          # hash-locked requirements files
          pip install -r requirements.txt -r tests/requirements.txt -r l10n/requirements-l10n.txt
          # An editable install can't satisfy hash-checking, so `-e .` can't
          # share an invocation with the hash-locked files above.
          pip install -e .
      - name: Compile translations
        run: python setup.py compile_catalog
      - name: Test with pytest
        run: |
          mkdir -p artifacts
          python -m pytest \
            --color=yes \
            --cov=seedsigner \
            --cov-branch \
            --durations 5 \
            -vv
      - name: Generate screenshots
        run: |
          python -m pytest tests/screenshot_generator/generator.py \
            --color=yes \
            --cov=seedsigner \
            --cov-append \
            --cov-branch \
            --cov-report html:./artifacts/cov_html \
            -vv
          cp -r ./seedsigner-screenshots ./artifacts/
      - name: EVM screens layout regression check
        # Real-rendering layout assertions for gui/screens/evm_screens.py (see that
        # file's own docstring) -- deliberately a separate invocation, same reason
        # as the screenshot generator above: it needs the real Renderer, not the
        # MagicMock the main "Test with pytest" step's suite installs over
        # seedsigner.gui.renderer.
        run: |
          python -m pytest tests/evm_screens_layout_regression_check.py \
            --color=yes \
            --cov=seedsigner \
            --cov-append \
            --cov-branch \
            -vv
      - name: Coverage report
        # Coverage was computed and printed every run but never enforced --
        # floor set just below the real current total (72.07% as of
        # 2026-09-30, confirmed from this exact step's own merged
        # pytest+screenshot-generator report, not the earlier mid-run
        # printout from the "Test with pytest" step alone, which only
        # reflects pytest's own run before --cov-append merges in the
        # screenshot generator's coverage). Small buffer, not 80%: the
        # 80% project-wide target (python/testing.md) is a real gap here
        # (gui/renderer.py 20%, scan_screens.py 18%, sevenf_screens.py 0%)
        # that a hard jump to 80% would just fail CI against, not close --
        # this gate's job is to stop further silent erosion, not to claim
        # the target is already met.
        run: coverage report --fail-under=70
      - name: Install gitleaks (pinned binary, checksum-verified)
        # Runs once, not once per matrix leg -- a secret-scan result doesn't
        # depend on the Python version under test. Not the official
        # gitleaks-action: that requires a paid GITLEAKS_LICENSE secret for
        # org-owned repos (this one is), confirmed via its own README.
        if: matrix.python-version == '3.12'
        run: |
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          echo "6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for committed secrets (gitleaks)
        if: matrix.python-version == '3.12'
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact -v
      - name: Archive CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.python-version }}
          path: artifacts/**
          retention-days: 10
        # Upload also when tests fail. The workflow result (red/green) will
        # not be affected by this.
        if: always()
