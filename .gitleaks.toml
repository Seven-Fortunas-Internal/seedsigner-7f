title = "seedsigner-7f secret-scanning config"

[extend]
useDefault = true

[allowlist]
description = "Known, deliberately-accepted findings -- each verified and justified here, not silently exempted"
regexes = [
  # TEST_PRIVATE_KEY in tests/test_broadcast_evm_demo.py,
  # tests/test_evm_transaction.py, tests/test_evm_plugin_transaction.py.
  # A hand-picked test fixture used only in _reference_signed_tx-style
  # helpers to build reference signatures for test assertions -- never
  # touches the real signing/wallet code path. Independently verified,
  # 2026-09-21: derives to address 0x2c7536E3605D9C16a7a3D7b1898e529396a65c23
  # (via eth_account.Account.from_key), confirmed eth_getBalance == 0x0 on
  # both Ethereum mainnet (eth.llamarpc.com) and Optimism
  # (optimism-rpc.publicnode.com) -- genuinely zero value, not just
  # assumed safe from its name.
  '''0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318''',

  # keys.root_ca.address / keys.devfund.address in tests/test_sevenf_root_ceremony.py,
  # flagged by gitleaks' generic-api-key entropy heuristic. Not secrets: these are
  # 7fchain ADDRESSES (public by design, same as a Bitcoin address), derived from
  # FIXED_SEED = bytes([0x2A] * MASTER_SEED_LEN) -- a trivial, all-identical-byte
  # test constant defined one line above, itself not a real seed.
  # `gitleaks detect` scans full history, so a value removed from the *current*
  # tree is still permanently present in an old commit -- allowlist entries are
  # additive forever, never replaced, once a matching string has ever been
  # committed (found the hard way: CI failed after this entry was edited
  # in-place instead of appended to, 2026-10-01).
  '''t1w65hh4c5ft3anmvc5nd57209vd9pw88un6ekd2hkqavajwc''',
  '''t1wxrtaq8t5cuuvea5gm9uzfagggxpasrpc5m93jkvmaqs7ea''',
  # RE-PINNED 2026-10-01: the role path's version segment became mandatory
  # ("ml-dsa/0" -> "ml-dsa/v1/0"), which moved these two addresses.
  '''t1jzu0kpu6eqfjq2y3wk6msk95wtuvx2fu4vk4lp3m79xkdec''',
  '''t1wa0dfam0d0xxnxv8tw657wvlr6tcz2c3fxs9w2dr9adyw7t''',
  # RE-PINNED 2026-10-03 (R27 single-grammar collapse): the two-level
  # purpose/role-path grammar collapsed into one path, which moved every
  # pinned KAT address again -- see test_sevenf_mldsa.py/
  # test_sevenf_root_ceremony.py's own doc comments.
  '''t136pq48mt9f3ym9dn3k3nh6f8dkpw6uje40rjx9djfnqg28v''',
]

# Path-excluded, not regex-allowlisted: these are official NIST ACVP test
# vectors (public keys, messages, signatures, seeds) published by NIST for
# exactly this purpose -- government-issued cryptographic test data, not
# secrets by any definition. They're long hex blobs, so generic
# entropy-based rules (aws-access-token, generic-api-key, etc.) match
# many short substrings inside them; regex-allowlisting each one
# individually doesn't scale and would need updating every time the fixture
# changes. See tests/test_ml_dsa_65_nist_acvp_conformance.py for what these
# actually verify and where they came from.
paths = [
  '''tests/fixtures/nist_acvp_ml_dsa_65_sigver_pure_external\.json''',
]
