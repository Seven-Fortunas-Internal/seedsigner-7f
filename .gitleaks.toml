  # 2026-09-21: derives to address 0x2c7536E3605D9C16a7a3D7b1898e529396a65c23
  # (via eth_account.Account.from_key), confirmed eth_getBalance == 0x0 on
  # both Ethereum mainnet (eth.llamarpc.com) and Optimism
  # (optimism-rpc.publicnode.com) -- genuinely zero value, not just
  # assumed safe from its name.
  '''0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318''',
]
